[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "matplotlib-mcp-server"
version = "0.1.0"
description = "Stateless API-key protected MCP server for Matplotlib charts"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.12,<2",
  "matplotlib>=3.10,<4",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[project.scripts]
matplotlib-mcp = "matplotlib_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matplotlib_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
